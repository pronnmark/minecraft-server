services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
      - "127.0.0.1:${RCON_PORT:-25575}:25575"
      - "${VOICE_CHAT_PORT:-24454}:24454/udp"
    environment:
      EULA: "TRUE"
      TYPE: "${SERVER_TYPE:-PAPER}"
      VERSION: "${MINECRAFT_VERSION:-LATEST}"
      MEMORY: "${MEMORY:-4G}"
      INIT_MEMORY: "${INIT_MEMORY:-2G}"
      MOTD: "${MOTD:-Minecraft Java Server on pbox}"
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-16}"
      ENABLE_COMMAND_BLOCK: "${ENABLE_COMMAND_BLOCK:-true}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-rcon_secret_password}"
      RCON_PORT: "25575"
      USE_AIKAR_FLAGS: "true"
      PVP: "${PVP:-true}"
      HARDCORE: "${HARDCORE:-false}"
      ALLOW_FLIGHT: "${ALLOW_FLIGHT:-false}"
      ENABLE_STATUS: "true"
      SYNC_CHUNK_WRITES: "true"
      MODRINTH_PROJECTS: |
        simple-voice-chat
        custom-join-messages
        voiceserver
      # Repo is the source of truth for /plugins config: always overwrite on start.
      PLUGINS_SYNC_UPDATE: "false"
    configs:
      - source: join-messages-chat
        target: /plugins/CustomJoinMessages/messages/chat.yml
      - source: voiceserver-config
        target: /plugins/VoiceServer/config.yml
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# Join instructions for proximity voice chat, and one voice group everyone auto-joins. The image copies /plugins into /data/plugins on start.
configs:
  join-messages-chat:
    content: |
      # Toggles whether chat messages should be sent.
      Enabled: true

      Public:
        Send-To-Console: true
        First-Join:
          1:
            Permission: cjm.default
            Radius: -1
            Max-Players: -1
            Messages:
              1:
                - "&e%name% joined the game for the first time"
        Join:
          1:
            Permission: cjm.default
            Messages:
              1:
                - "&e%name% joined the game"
        Quit:
          1:
            Permission: cjm.default
            Messages:
              1:
                - "&e%name% left the game"

      Private:
        First-Join:
          1:
            Permission: cjm.default
            Messages:
              1:
                - "&6&l[Voice] &eThis server has PROXIMITY VOICE CHAT!"
                - "&7To hear and talk, install the &aSimple Voice Chat &7mod (Fabric, 26.3):"
                - "&bhttps://modrinth.com/mod/simple-voice-chat"
                - "&7Easiest: get the &fModrinth App &7(modrinth.com/app), search &fSimple Voice Chat&7, click &fInstall&7, play that profile."
                - "&7Everyone is auto-joined to the &fEveryone &7voice group, so you hear all players anywhere."
                - "&7In game: &fV &7= settings, &fCaps Lock &7= push-to-talk, &fG &7= groups."
        Join:
          1:
            Permission: cjm.default
            Messages:
              1:
                - "&6&l[Voice] &7Proximity voice chat is on. No voice? Get the &aSimple Voice Chat &7mod:"
                - "&bhttps://modrinth.com/mod/simple-voice-chat &7(press &fV &7in game)"

  voiceserver-config:
    content: |
      chat-prefix: "§7[§9Voice§7]"
      debug: false
      persistent-groups-should-survive-restart: true
      persistent-groups:
        - "Everyone+open+[null]"
      default-group:
        name: "Everyone"
        persistent: true
