services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
      - "127.0.0.1:${RCON_PORT:-25575}:25575"
      - "${VOICE_CHAT_PORT:-24454}:24454/udp"
    environment:
      EULA: "TRUE"
      TYPE: "${SERVER_TYPE:-PAPER}"
      VERSION: "${MINECRAFT_VERSION:-LATEST}"
      MEMORY: "${MEMORY:-4G}"
      INIT_MEMORY: "${INIT_MEMORY:-2G}"
      MOTD: "${MOTD:-Minecraft Java Server on pbox}"
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-16}"
      ENABLE_COMMAND_BLOCK: "${ENABLE_COMMAND_BLOCK:-true}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-rcon_secret_password}"
      RCON_PORT: "25575"
      USE_AIKAR_FLAGS: "true"
      PVP: "${PVP:-true}"
      HARDCORE: "${HARDCORE:-false}"
      ALLOW_FLIGHT: "${ALLOW_FLIGHT:-false}"
      ENABLE_STATUS: "true"
      SYNC_CHUNK_WRITES: "true"
      MODRINTH_PROJECTS: "simple-voice-chat"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
